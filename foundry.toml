[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.22"

remappings = [
    '@aerodrome-finance/slipstream/=lib/slipstream/contracts/',
    '@beefyfinance/beefy-contracts/=lib/beefy-contracts/contracts/',
    '@chainlink/contracts/=lib/chainlink-brownie-contracts/contracts/',
    "@forge-std/=lib/forge-std/",
    "@openzeppelin/contracts=lib/openzeppelin-contracts/contracts",
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts",
    '@prb/math/=lib/prb-math/src/',
    '@velodrome-finance/pool-launcher/=lib/pool-launcher/src',
    'contracts/core/interfaces/callback/ICLSwapCallback.sol=lib/slipstream/contracts/core/interfaces/callback/ICLSwapCallback.sol',
]
evm_version = "shanghai"

[invariant]
runs = 256
depth = 64

fail_on_revert = true